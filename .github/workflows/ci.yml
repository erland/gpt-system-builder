name: System Builder canonical CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML jsonschema
      - name: Validate and build canonical distributions
        run: bash scripts/ci-migrated.sh 1.5.0
      - name: Explicit canonical build and validation
        run: |
          python scripts/build_distributions.py --version 1.5.0
          python scripts/validate_distributions.py
      - uses: actions/upload-artifact@v4
        with:
          name: system-builder-ci-distributions
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
          if-no-files-found: error
