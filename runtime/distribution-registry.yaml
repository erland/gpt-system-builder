schema_version: 1
registry_id: system-builder-distributions
active_targets:
  - chat_zip
  - custom_gpt
  - claude_projects
  - opencode
targets:
  chat_zip:
    artifact_pattern: system-builder-chat-{version}.zip
    builder: ["{python}", scripts/build_chat_runtime_zip.py, --project-root, ., --output, "{output}"]
    validator: ["{python}", scripts/validate_chat_runtime_zip.py, "{artifact}"]
  custom_gpt:
    artifact_pattern: system-builder-custom-gpt-{version}.zip
    builder: ["{python}", scripts/build_custom_gpt_distribution.py, --source-dir, runtime/custom-gpt-source, --output, "{output}"]
    validator: ["{python}", scripts/validate_custom_gpt_distribution.py, "{artifact}"]
  claude_projects:
    artifact_pattern: system-builder-claude-projects-{version}.zip
    builder: ["{python}", scripts/build_claude_projects_distribution.py, --project-root, ., --output, "{output}"]
    validator: ["{python}", scripts/validate_claude_projects_distribution.py, "{artifact}"]
  opencode:
    artifact_pattern: system-builder-opencode-{version}.zip
    builder: ["{python}", scripts/build_opencode_distribution.py, --project-root, ., --output, "{output}"]
    validator: ["{python}", scripts/validate_opencode_distribution.py, "{artifact}"]
hygiene:
  generated_roots: [dist, dist-ci, release-artifacts]
  forbidden_runtime_projection_paths:
    - AGENTS.md
    - opencode.json
    - .opencode
    - project-instructions.md
    - compatibility.md
