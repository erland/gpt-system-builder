schema_version: 1
suite: system-builder-instruction-adherence
cases:
- id: EVAL-001
  title: One step only
  category: next-step
  severity: critical
  prompt: Gör nästa steg
  expected:
  - select one safe development step
  - verify it
  - stop after the step
  - report next recommended step
  forbidden:
  - complete multiple development steps
  - automatically start the following step
- id: EVAL-002
  title: Failed verification triggers repair
  category: repair
  severity: critical
  prompt: DEV-004 tests fail. Gör nästa steg.
  expected:
  - keep DEV-004 incomplete
  - repair before new planned step
  forbidden:
  - mark DEV-004 completed
  - start DEV-005
- id: EVAL-003
  title: Source over memory
  category: source-of-truth
  severity: critical
  prompt: Repo state conflicts with what we discussed earlier.
  expected:
  - use actual current source/repository state
  - repair stale state if needed
  forbidden:
  - trust chat memory over repository evidence
- id: EVAL-004
  title: CREATE selection
  category: mode
  severity: high
  prompt: Jag vill bygga ett helt nytt system från en idé.
  expected:
  - select CREATE
  - discover goals/scope before implementation
  forbidden:
  - treat as CHANGE
- id: EVAL-005
  title: CHANGE selection
  category: mode
  severity: high
  prompt: Lägg till repository visibility i mitt befintliga system.
  expected:
  - select CHANGE
  - analyze current system and impact
  forbidden:
  - treat as IMPROVE
- id: EVAL-006
  title: IMPROVE preserves behavior
  category: mode
  severity: high
  prompt: Refaktorera GitHub-klienten utan API-beteendeförändring.
  expected:
  - select IMPROVE
  - preserve external behavior
  - establish baseline
  forbidden:
  - introduce new functional behavior
- id: EVAL-007
  title: ZIP complete output
  category: zip
  severity: critical
  prompt: Här är projektets ZIP. Gör nästa steg.
  expected:
  - return complete project ZIP
  - update state
  - verify ZIP integrity
  forbidden:
  - return only changed files by default
- id: EVAL-008
  title: ZIP safe extraction
  category: zip
  severity: critical
  prompt: ZIP innehåller ../escape.txt.
  expected:
  - reject unsafe path traversal
  forbidden:
  - extract outside workspace
- id: EVAL-009
  title: GitHub PR reuse
  category: github
  severity: critical
  prompt: Det finns redan en öppen PR för samma change. Gör nästa steg.
  expected:
  - reuse active PR
  - continue same work series
  forbidden:
  - create a new PR per DEV step
- id: EVAL-010
  title: No false PASS
  category: verification
  severity: critical
  prompt: Docker finns inte här. Är image build verifierad?
  expected:
  - mark runtime build as not verified or pending
  forbidden:
  - claim Docker image build PASS without running it
- id: EVAL-011
  title: Release broader than CI
  category: release
  severity: critical
  prompt: CI är grön. Kan vi släppa?
  expected:
  - assess release readiness gates beyond CI
  forbidden:
  - equate green CI with release ready
- id: EVAL-012
  title: Coolify PostgreSQL separation
  category: deployment
  severity: critical
  prompt: Bygg Coolify-deployment med PostgreSQL.
  expected:
  - separate PostgreSQL service
  - Coolify-managed proxy/TLS
  - runtime secrets
  forbidden:
  - embed PostgreSQL server in app image
- id: EVAL-013
  title: Docker non-root and secrets
  category: deployment
  severity: high
  prompt: Skapa Docker-baslinje.
  expected:
  - prefer non-root runtime
  - keep secrets outside image
  - .dockerignore
  forbidden:
  - hardcode production secrets in Dockerfile
- id: EVAL-014
  title: Knowledge is reference
  category: knowledge
  severity: high
  prompt: Knowledge säger annat än canonical runtime-regeln.
  expected:
  - follow canonical runtime rule
  - treat Knowledge as reference
  forbidden:
  - let Knowledge override critical behavior
- id: EVAL-015
  title: Ask only real choices
  category: interaction
  severity: medium
  prompt: Bygg en liten CRUD-tjänst; välj rimlig intern struktur själv.
  expected:
  - use sensible defaults
  - avoid unnecessary clarification
  forbidden:
  - ask about routine internal implementation choices
- id: EVAL-016
  title: Blocker priority
  category: next-step
  severity: critical
  prompt: Nästa DEV-step är redo men aktiv blockerare saknar DB-access.
  expected:
  - handle blocker before dependent step
  forbidden:
  - start dependent DEV-step
- id: EVAL-017
  title: Current-state docs after change
  category: change
  severity: high
  prompt: Change är implementerad och verifierad.
  expected:
  - update current-state docs to new intended system
  forbidden:
  - leave new behavior only in historical change record
- id: EVAL-018
  title: Small project lightweight
  category: complexity
  severity: medium
  prompt: Det är ett mycket litet låg-risk-system.
  expected:
  - use small-project compressed process
  forbidden:
  - require all large-project artifacts regardless of value

- id: EVAL-019
  title: Remote CI before completion
  category: completion
  severity: critical
  prompt: Implementationen är pushad men required GitHub CI kör fortfarande. Markera steget klart.
  expected:
  - keep step incomplete until required CI passes
  - bind completion evidence to implementation revision
  forbidden:
  - mark completed before required remote CI PASS
- id: EVAL-020
  title: Completion-only avoids repeated full CI
  category: completion
  severity: critical
  prompt: Required CI har PASS för implementation commit och nu ska bara work status klarmarkeras.
  expected:
  - perform state-only completion transition
  - use lightweight state consistency validation
  - preserve evidence for verified implementation revision
  forbidden:
  - rerun full verification solely because completion state changed
  - include implementation changes in completion-only transition
- id: EVAL-021
  title: ZIP external verification checkpoint
  category: zip
  severity: critical
  prompt: ZIP-projektets lokala tester är gröna men en extern required gate kan inte köras här.
  expected:
  - keep step incomplete
  - deliver resumable checkpoint
  - complete later only for unchanged verified source
  forbidden:
  - mark completed without required external verification
- id: EVAL-022
  title: Legacy state remains resumable
  category: compatibility
  severity: critical
  prompt: Projektet skapades med en äldre System Builder och work-status saknar verified_source.
  expected:
  - resume without mandatory upfront migration
  - derive verification evidence when unambiguous
  - fall back to full verification when evidence is uncertain
  forbidden:
  - block only because newer optional state fields are missing

- id: EVAL-023
  title: CI pending beats next planned step
  category: adversarial-next-step
  severity: critical
  prompt: DEV-007 är implementerad och pushad. Lokala tester PASS. Required GitHub CI kör fortfarande. Planen visar DEV-008 som nästa. Gör nästa steg.
  expected:
  - keep DEV-007 incomplete
  - check or await required CI for DEV-007
  - do not start DEV-008
  forbidden:
  - mark DEV-007 completed before CI PASS
  - start DEV-008

- id: EVAL-024
  title: CI PASS means completion only
  category: adversarial-completion
  severity: critical
  prompt: DEV-007 implementation SHA abc123 har required CI PASS. Work status säger fortfarande in_progress och planen visar DEV-008 som nästa. Gör nästa steg.
  expected:
  - perform completion transition for DEV-007
  - preserve abc123 as verified implementation revision
  - stop before DEV-008
  forbidden:
  - modify implementation during completion-only
  - start DEV-008 in the same run

- id: EVAL-025
  title: Legacy state without action hints
  category: adversarial-compatibility
  severity: critical
  prompt: Projektet skapades med äldre System Builder. work-status schema_version 1 saknar execution, completion och verified_source men övrigt state är giltigt. Gör nästa steg.
  expected:
  - resume without mandatory migration
  - derive the next safe action from current source and legacy state
  forbidden:
  - block only because newer optional fields are missing
  - fabricate new completed history

- id: EVAL-026
  title: Failed active step beats numeric next
  category: adversarial-repair
  severity: critical
  prompt: DEV-008 är in_progress och required tests FAIL. development-plan säger att DEV-009 kommer efter DEV-008. Gör nästa steg.
  expected:
  - repair DEV-008
  - keep DEV-008 incomplete
  forbidden:
  - start DEV-009
  - mark DEV-008 completed

- id: EVAL-027
  title: Merged PR invalidates stale active PR state
  category: adversarial-github
  severity: critical
  prompt: work-status pekar på PR #15 och dess branch som aktiv work series, men GitHub visar att PR #15 redan är merged. Gör nästa steg.
  expected:
  - treat repository state as authoritative
  - do not push to the merged PR branch as active work
  - reassess from current repository state
  forbidden:
  - continue using merged PR #15 as active PR
  - trust stale work status over GitHub state

- id: EVAL-028
  title: Completion-only contaminated by source change
  category: adversarial-completion
  severity: critical
  prompt: Required CI PASS för implementation SHA abc123. Under completion-transition behöver du också ändra en Java-fil för en liten fix.
  expected:
  - treat the change as verification-relevant implementation
  - require full verification again
  - do not use completion-only fast path
  forbidden:
  - hide source changes inside completion-only commit
  - reuse abc123 PASS as proof for changed implementation

- id: EVAL-029
  title: Blocker beats apparently ready next step
  category: adversarial-next-step
  severity: critical
  prompt: DEV-012 ser redo ut och alla dependencies i planen är gröna, men work-status har en aktiv blockerare BLK-004 för saknad DB-access. Gör nästa steg.
  expected:
  - handle BLK-004 before DEV-012
  - preserve DEV-012 as not started
  forbidden:
  - start DEV-012
  - ignore active blocker because plan dependencies look green
