schema_version: 2
dimensions:
  behavior:
    severity: critical
    requirements:
      - id: PAR-BEH-001
        name: operating-modes
        groups:
          - [create]
          - [change]
          - [improve]
      - id: PAR-BEH-002
        name: one-step
        groups:
          - [one safe development step, one completed step]
          - [stop]
      - id: PAR-BEH-003
        name: source-state
        groups:
          - [actual current source, actual source]
          - [chat memory]
      - id: PAR-BEH-004
        name: repair
        groups:
          - [repair]
          - [verification fails, verification failure, failed required verification]
      - id: PAR-BEH-005
        name: false-pass
        groups:
          - [unrun check as pass]
      - id: PAR-BEH-006
        name: release
        groups:
          - [ready_with_warnings]
          - [not_ready]
  capability:
    severity: critical
    canonical_requirements:
      filesystem_read: required
      filesystem_write: required
      code_execution: required
      structured_data: required
      persistent_state: required
      external_tools: recommended
    runtime_expectations:
      chat_zip: equivalent
      custom_gpt: equivalent_with_platform_constraints
      claude_projects: reduced
      opencode: equivalent
      openai_plugin: reduced
  artifact:
    severity: high
    required_outputs:
      - development_plan
      - work_status
      - verification_evidence
    conditional_outputs:
      - project_package
      - repository_update
    runtime_expectations:
      chat_zip: equivalent
      custom_gpt: equivalent_with_platform_constraints
      claude_projects: reduced
      opencode: equivalent
      openai_plugin: reduced
  workspace_state:
    severity: critical
    authority: workspace_file
    conversation_fallback: false
    state_path: .system-builder/work-status.yaml
    runtime_expectations:
      chat_zip: equivalent
      custom_gpt: equivalent_with_platform_constraints
      claude_projects: reduced
      opencode: equivalent
      openai_plugin: reduced
  tool:
    severity: critical
    declared_tools:
      - workspace-read
      - workspace-write
      - run-verification
      - repository-actions
      - package-project
    required_tools:
      - workspace-read
      - workspace-write
      - run-verification
    runtime_expectations:
      chat_zip: equivalent
      custom_gpt: equivalent_with_platform_constraints
      claude_projects: reduced
      opencode: equivalent
      openai_plugin: reduced
runtime_policy:
  active:
    - chat_zip
    - custom_gpt
    - claude_projects
    - opencode
    - openai_plugin
  reduced_runtime_requirements:
    claude_projects:
      must_document_limitations:
        - local command execution
        - deterministic project verification
        - workspace mutation
        - GitHub write actions
      must_preserve:
        - canonical behavior
        - workspace-file authority
        - no false PASS for unrun verification
    openai_plugin:
      must_document_limitations:
        - filesystem read/write
        - code execution
        - persistent workspace/state
        - GitHub
      must_preserve:
        - canonical behavior
        - workspace-file authority
        - no false PASS for unrun verification

capability_aware_execution:
  required_invariants:
    - capability discovery uses actual host/tool availability
    - optional companion capability absence does not block base functionality
    - required capability absence blocks or uses an explicit safe fallback
    - GitHub Actions are preferred over redundant Agent Workspace execution
    - PWA Preview READY is not functional verification
    - Browser Screenshot capture is not functional verification
    - unrun verification is never reported as PASS
  scenarios:
    - github_with_agent_workspace
    - github_without_agent_workspace
    - zip_with_local_execution
    - openai_plugin_with_required_execution
    - openai_plugin_without_required_execution
    - pwa_preview_available_unavailable
    - browser_screenshot_available_unavailable
    - no_companion_plugins
