schema_version: 2
dimensions:
  behavior:
    severity: critical
    requirements:
      - id: PAR-BEH-001
        name: operating-modes
        groups:
          - [create]
          - [change]
          - [improve]
      - id: PAR-BEH-002
        name: one-step
        groups:
          - [one safe development step, one completed step]
          - [stop]
      - id: PAR-BEH-003
        name: source-state
        groups:
          - [actual current source, actual source]
          - [chat memory]
      - id: PAR-BEH-004
        name: repair
        groups:
          - [repair]
          - [verification fails, verification failure, failed required verification]
      - id: PAR-BEH-005
        name: false-pass
        groups:
          - [unrun check as pass]
      - id: PAR-BEH-006
        name: release
        groups:
          - [ready_with_warnings]
          - [not_ready]
  capability:
    severity: critical
    canonical_requirements:
      filesystem_read: required
      filesystem_write: required
      code_execution: required
      structured_data: required
      persistent_state: required
      external_tools: recommended
    runtime_expectations:
      chat_zip: equivalent
      custom_gpt: equivalent_with_platform_constraints
      claude_projects: reduced
      opencode: equivalent
      openai_plugin: reduced
  artifact:
    severity: high
    required_outputs:
      - development_plan
      - work_status
      - verification_evidence
    conditional_outputs:
      - project_package
      - repository_update
    runtime_expectations:
      chat_zip: equivalent
      custom_gpt: equivalent_with_platform_constraints
      claude_projects: reduced
      opencode: equivalent
      openai_plugin: reduced
  workspace_state:
    severity: critical
    authority: workspace_file
    conversation_fallback: false
    state_path: .system-builder/work-status.yaml
    runtime_expectations:
      chat_zip: equivalent
      custom_gpt: equivalent_with_platform_constraints
      claude_projects: reduced
      opencode: equivalent
      openai_plugin: reduced
  tool:
    severity: critical
    declared_tools:
      - workspace-read
      - workspace-write
      - run-verification
      - repository-actions
      - package-project
    required_tools:
      - workspace-read
      - workspace-write
      - run-verification
    runtime_expectations:
      chat_zip: equivalent
      custom_gpt: equivalent_with_platform_constraints
      claude_projects: reduced
      opencode: equivalent
      openai_plugin: reduced
runtime_policy:
  active:
    - chat_zip
    - custom_gpt
    - claude_projects
    - opencode
    - openai_plugin
  reduced_runtime_requirements:
    claude_projects:
      must_document_limitations:
        - local command execution
        - deterministic project verification
        - workspace mutation
        - GitHub write actions
      must_preserve:
        - canonical behavior
        - workspace-file authority
        - no false PASS for unrun verification
    openai_plugin:
      must_document_limitations:
        - filesystem read/write
        - code execution
        - persistent workspace/state
        - GitHub
      must_preserve:
        - canonical behavior
        - workspace-file authority
        - no false PASS for unrun verification

capability_aware_execution:
  severity: critical
  runtime_expectations:
    chat_zip: equivalent
    custom_gpt: reduced
    claude_projects: reduced
    opencode: equivalent
    openai_plugin: reduced
  required_invariants:
    - id: CAP-PAR-001
      groups:
        - [actual host, actual current host, actual host/tool availability]
        - [unknown, unavailable]
    - id: CAP-PAR-002
      groups:
        - [optional]
        - [does not block, do not block, non-blocking]
    - id: CAP-PAR-003
      groups:
        - [required capability, required capabilities]
        - [block, blocked, safe fallback]
    - id: CAP-PAR-004
      groups:
        - [unrun check as pass, false pass, no false pass]
  full_runtime_invariants:
    - id: CAP-FULL-001
      groups:
        - [github actions]
        - [agent workspace]
    - id: CAP-FULL-002
      groups:
        - [pwa preview]
        - [functional verification, functional browser]
    - id: CAP-FULL-003
      groups:
        - [browser screenshot]
        - [functional verification, playwright, e2e]
  reduced_runtime_requirements:
    custom_gpt:
      rationale: Instruction budget is constrained; preserve core safety/fallback invariants without duplicating companion-specific routing details.
      must_preserve:
        - actual source/state over memory
        - optional missing capabilities must not cause false PASS
        - required unavailable verification must remain pending/deferred or blocked
        - no false PASS for unrun verification
      companion_details_required: false
    claude_projects:
      companion_details_required: false
    openai_plugin:
      companion_details_required: false
  scenarios:
    - github_with_agent_workspace
    - github_without_agent_workspace
    - zip_with_local_execution
    - openai_plugin_with_required_execution
    - openai_plugin_without_required_execution
    - pwa_preview_available_unavailable
    - browser_screenshot_available_unavailable
    - no_companion_plugins
