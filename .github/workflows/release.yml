name: Build GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0-rc.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Validate, build and publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Manual releases must build the explicitly requested tag, not the default branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip PyYAML jsonschema

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name || github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

      - name: Build release artifacts
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          bash scripts/ci-migrated.sh "$VERSION"
          python3 scripts/validate_distribution_registry.py
          python3 scripts/validate_distributions.py
          mkdir -p release-artifacts
          cp dist/*.zip dist/SHA256SUMS.txt dist/DELIVERY-MANIFEST.json release-artifacts/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: system-builder-${{ steps.tag.outputs.tag }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber
          else
            gh release create "$TAG" release-artifacts/* --generate-notes --title "System Builder $TAG"
          fi
