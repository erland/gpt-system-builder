name: System Builder CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: system-builder-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project and distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect verification mode
        id: verification-mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^ HEAD > /tmp/system-builder-changed-paths.txt
          if python3 scripts/classify_completion_only.py --paths-file /tmp/system-builder-changed-paths.txt; then
            echo "mode=completion" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip PyYAML jsonschema

      - name: Run lightweight completion validation
        if: steps.verification-mode.outputs.mode == 'completion'
        run: python scripts/validate_completion_transition.py

      - name: Run System Builder project CI
        if: steps.verification-mode.outputs.mode == 'full'
        run: bash scripts/ci-project.sh
