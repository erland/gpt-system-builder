schema_version: 1
requirements:
- id: REQ-ONE-STEP
  severity: critical
  groups:
  - - one safe development step
    - one completed step
  - - do not automatically continue
    - then stop
- id: REQ-SOURCE
  severity: critical
  groups:
  - - actual current source
    - actual source
  - - chat memory
- id: REQ-REPAIR
  severity: critical
  groups:
  - - repair
  - - verification fails
    - verification failure
    - required verification failure
- id: REQ-ZIP
  severity: critical
  groups:
  - - complete project zip
  - - path traversal
- id: REQ-GITHUB
  severity: critical
  groups:
  - - reuse the active pr
    - reuse active pr
    - reuse existing pr
  - - work series
    - same series
- id: REQ-FALSE-PASS
  severity: critical
  groups:
  - - never report an unrun check as pass
    - never report an unrun check as pass.
- id: REQ-RELEASE
  severity: critical
  groups:
  - - ready_with_warnings
  - - green ci alone
    - do not equate green ci
- id: REQ-COOLIFY
  severity: critical
  groups:
  - - postgresql server must not be embedded
    - postgresql server must not be embedded in the app image
  - - coolify
- id: REQ-KNOWLEDGE
  severity: high
  groups:
  - - knowledge is reference material
    - knowledge is reference
  - - critical runtime rules
    - critical behavior
- id: REQ-MODES
  severity: high
  groups:
  - - create
  - - change
  - - improve

- id: REQ-COMPLETION-TRANSITION
  severity: critical
  groups:
  - - completion-only
    - completion transition
  - - lightweight
  - - implementation commit
    - source revision
- id: REQ-LEGACY-STATE
  severity: critical
  groups:
  - - older system builder
    - older project
    - older state
  - - full verification
    - fall back

- id: REQ-SMALL-MODEL-INVARIANTS
  severity: critical
  groups:
  - - critical invariants
    - always
  - - blockers and failed required verification come first
    - failed verification/drift→repair
  - - never change implementation during a completion-only transition
    - never change implementation during completion-only
  - - report the next recommended action and stop
    - next recommended action, then stop

- id: REQ-GOVERNING-DOC-INTENT
  severity: critical
  groups:
  - - governing intent
    - govern intent
    - governing current-intent
  - - do not silently rewrite
    - never rewrite intent merely to fit code
    - do not rewrite intent merely to fit code
  - - final documentation reconciliation
    - final doc reconciliation
    - reconcile code vs docs

- id: REQ-ZIP-BEST-EFFORT-VERIFY
  severity: critical
  groups:
  - - every required verification gate that is technically possible
    - every feasible required check
    - verify automatically as far as
  - - ci is not inherently an external gate
    - ci is not external if equivalent canonical commands
    - ci is not external if equivalent
  - - external/manual verification only
    - leave incomplete only for
    - genuinely requires

